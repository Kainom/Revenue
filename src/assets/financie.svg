<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Fundo círculo -->
  <circle cx="100" cy="100" r="90" fill="none"/>

  <!-- Barras gráfico -->
  <rect x="55" y="110" width="15" height="35" rx="3" fill="#22c55e"/>
  <rect x="80" y="95" width="15" height="50" rx="3" fill="#22c55e"/>
  <rect x="105" y="75" width="15" height="70" rx="3" fill="#22c55e"/>

  <!-- Seta crescimento -->
  <path d="M50 120 L90 80 L110 95 L145 55" 
        stroke="#facc15" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Ponta seta -->
  <polygon points="145,55 138,55 145,45 152,55" fill="#facc15"/>

  <!-- Texto -->
  <text x="100" y="165" 
        text-anchor="middle" 
        fill="white" 
        font-size="24" 
        font-family="Arial, sans-serif">
        Financie
  </text>

</svg>
